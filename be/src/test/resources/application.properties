spring.application.name=booking-test
server.port=0

# H2 in-memory Database for testing (PostgreSQL Compatibility Mode)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate for test
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
